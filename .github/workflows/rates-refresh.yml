name: Refresh energy prices data

# Monthly refresh of prices_json/ from MaxPr1me/canada-utility-rates (which
# itself scrapes on the 1st) + StatCan 18-10-0001 heating oil. Runs on the
# 3rd to give the upstream scrape two days of slack. rates_etl.py exits
# non-zero on any fetch/validation failure, so a bad pull never reaches the
# commit step.

on:
  schedule:
    - cron: "0 14 3 * *"   # 14:00 UTC on the 3rd of every month
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write

# gh-pages is amended and force-pushed; never let two refreshes race for it.
concurrency:
  group: gh-pages-deploy

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # main: code + pipelines

      - uses: actions/checkout@v4          # gh-pages: the published data
        with:
          ref: gh-pages
          path: .ghpages

      - name: Seed existing data from gh-pages
        run: cp -r .ghpages/prices_json ./prices_json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run rates ETL
        working-directory: Python
        run: python rates_etl.py --refresh

      # Data lives on gh-pages, which is kept at a single commit: amend and
      # force-push rather than adding a commit per refresh.
      - name: Publish to gh-pages (only if changed)
        working-directory: .ghpages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rsync -a --delete ../prices_json/ ./prices_json/
          git add prices_json
          if git diff --cached --quiet; then
            echo "No price changes this month."
          else
            git commit --amend --date=now \
              -m "Deploy site + data ($(date +%F)) — monthly energy prices refresh" \
              -m "Single-commit branch; source and history live on main."
            git push --force origin HEAD:gh-pages
          fi
