name: Refresh AHRI heat-pump certificate lookup

# Weekly refresh of lookup/ahri_numbers.json. Runs without the raw ERS CSVs
# (local-only, 8+ GB) -- candidates come from the already-committed
# Python/ahri_numbers_all.json, and existing entries are re-checked on a
# rolling basis (oldest-checked first) to catch AHRI amending a certificate
# after the fact, e.g. a cold-climate designation changing on a cert already
# in the lookup -- see Python/refresh_ahri_lookup.py's docstring for the
# 211644151 case this is meant to catch. refresh_ahri_lookup.py only ever
# writes entries built from a real API response for that exact reference
# number (or a clean "not found" -> Delisted), so a bad run degrades to
# "made less progress this week", not "wrote wrong data" -- there is no
# review step before the push.

on:
  schedule:
    - cron: "0 15 * * 1"   # 15:00 UTC every Monday (grid-refresh runs 13:00 UTC same day)
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Override AHRI_REFRESH_MAX_REQUESTS for this run"
        required: false
        default: ""

permissions:
  contents: write

# gh-pages is amended and force-pushed; never let two refreshes race for it.
concurrency:
  group: gh-pages-deploy

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # main: code + pipelines

      - uses: actions/checkout@v4          # gh-pages: the published data
        with:
          ref: gh-pages
          path: .ghpages

      - name: Seed existing lookup from gh-pages
        run: cp -r .ghpages/lookup ./lookup

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run AHRI lookup refresh
        working-directory: Python
        env:
          AHRI_REFRESH_MAX_REQUESTS: ${{ github.event.inputs.max_requests }}
        run: python refresh_ahri_lookup.py | tee refresh_output.log

      # Data lives on gh-pages, which is kept at a single commit: amend and
      # force-push rather than adding a commit per refresh.
      - name: Publish to gh-pages (only if changed)
        run: |
          SUMMARY=$(grep '^AHRI_REFRESH_SUMMARY' Python/refresh_output.log | sed 's/^AHRI_REFRESH_SUMMARY //')
          cd .ghpages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rsync -a --delete ../lookup/ ./lookup/
          git add lookup
          if git diff --cached --quiet; then
            echo "No AHRI data changes this week."
          else
            git commit --amend --date=now \
              -m "Deploy site + data ($(date +%F)) — weekly AHRI lookup refresh" \
              -m "$SUMMARY" \
              -m "Single-commit branch; source and history live on main."
            git push --force origin HEAD:gh-pages
          fi
