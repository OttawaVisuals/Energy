name: Refresh construction data

# Monthly refresh of construction_json/ AND permits_json/ from StatCan WDS,
# Bank of Canada and nine municipal open-data portals.
# Runs after StatCan's building-permits release (~6 weeks after the reference
# month, mid-month). Both ETL scripts exit non-zero on any fetch failure, so
# a partial pull never reaches the commit step.

on:
  schedule:
    - cron: "0 14 20 * *"   # 14:00 UTC on the 20th of every month
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write

# gh-pages is amended and force-pushed; never let two refreshes race for it.
concurrency:
  group: gh-pages-deploy

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # main: code + pipelines

      - uses: actions/checkout@v4          # gh-pages: the published data
        with:
          ref: gh-pages
          path: .ghpages

      # permits_json/ may not exist on gh-pages yet on the first run after
      # the Permits Explorer shipped, so seeding it is best-effort. The ETL
      # rebuilds every city from scratch anyway; the seed only matters for
      # construction_json, whose cited-figures step can legitimately no-op
      # and needs the previous file left in place.
      - name: Seed existing data from gh-pages
        run: |
          cp -r .ghpages/construction_json ./construction_json
          cp -r .ghpages/permits_json ./permits_json 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas openpyxl   # openpyxl: EWRB ships XLSX

      - name: Run core ETL (permits, starts, investment)
        working-directory: Python
        run: python construction_etl.py --refresh

      - name: Run context ETL (rates, prices, population, employment)
        working-directory: Python
        run: python construction_context_etl.py --refresh

      - name: Run municipal permits ETL (nine cities, 2017-floored summary)
        working-directory: Python
        run: python municipal_permits_etl.py

      # The Permits Explorer's own tree. Separate from municipal.json above:
      # that one is the 2017-floored summary for construction.html, this is
      # the full per-city record (history, category matrices, density grids,
      # filer lists). Runs after it so a portal outage fails the cheaper
      # script first.
      - name: Run permits detail ETL (nine city permit desks)
        working-directory: Python
        run: python permits_detail_etl.py

      - name: Run Ontario EWRB ETL (large-building energy)
        working-directory: Python
        run: python ewrb_etl.py

      # The cite-only figures (NRCan Greener Homes, CHBA Net Zero, CHBA HMI)
      # are hand-transcribed, not fetched — this step only re-confirms they
      # still appear on the publishers' live pages and rewrites programs.json.
      # NON-BLOCKING on purpose: when a publisher posts an update the check
      # fails, which should show up as a warning to act on, not take the whole
      # monthly data refresh down with it. The previous programs.json (seeded
      # from gh-pages above) is left in place.
      - name: Check cited figures are current
        continue-on-error: true
        working-directory: Python
        run: python cited_figures_verify.py

      # cagbc_leed_etl.py is DELIBERATELY not run here. It reads
      # project_profile.csv, a manual export from leed.cagbc.org with no API
      # and no sign-in — there is no way to fetch it in CI. The construction_
      # json/cagbc.json seeded from gh-pages above just carries forward
      # unchanged each month until someone re-exports the CSV locally, runs
      # this script by hand, and republishes cagbc.json through the
      # incremental gh-pages update path documented in CLAUDE.md.

      # Data lives on gh-pages, which is kept at a single commit: amend and
      # force-push rather than adding a commit per refresh.
      - name: Publish to gh-pages (only if changed)
        working-directory: .ghpages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rsync -a --delete ../construction_json/ ./construction_json/
          rsync -a --delete ../permits_json/ ./permits_json/
          git add construction_json permits_json
          if git diff --cached --quiet; then
            echo "No data changes this month."
          else
            git commit --amend --date=now \
              -m "Deploy site + data ($(date +%F)) — monthly construction & permits refresh" \
              -m "Single-commit branch; source and history live on main."
            git push --force origin HEAD:gh-pages
          fi
