name: Refresh grid dashboard data

# Weekly refresh of grid_json/ from IESO (live) + cached AESO/HQ exports.
# grid_etl.py exits non-zero only if the ON (IESO) monthly cross-check fails
# or IESO fetch itself fails -- AB/QC being stale (no new AESO/HQ file
# manually added) is expected and does not block the ON update. See
# Python/grid_etl.py's module docstring for why AB/QC aren't live-fetchable.

on:
  schedule:
    - cron: "0 13 * * 1"   # 13:00 UTC every Monday
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run grid ETL (ON live fetch + AB/QC from cached exports)
        working-directory: Python
        run: python grid_etl.py

      - name: Commit updated data (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grid_json/
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "chore: weekly grid dashboard data refresh"
            git push
          fi
