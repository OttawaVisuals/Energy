name: Refresh grid dashboard data

# Weekly refresh of grid_json/ from IESO (live) + cached AESO/HQ exports.
# grid_etl.py exits non-zero only if the ON (IESO) monthly cross-check fails
# or IESO fetch itself fails -- AB/QC being stale (no new AESO/HQ file
# manually added) is expected and does not block the ON update. See
# Python/grid_etl.py's module docstring for why AB/QC aren't live-fetchable.

on:
  schedule:
    - cron: "0 13 * * 1"   # 13:00 UTC every Monday
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write

# gh-pages is amended and force-pushed; never let two refreshes race for it.
concurrency:
  group: gh-pages-deploy

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # main: code + pipelines

      - uses: actions/checkout@v4          # gh-pages: the published data
        with:
          ref: gh-pages
          path: .ghpages

      - name: Seed existing data from gh-pages
        run: cp -r .ghpages/grid_json ./grid_json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run grid ETL (ON live fetch + AB/QC from cached exports)
        working-directory: Python
        run: python grid_etl.py

      # Data lives on gh-pages, which is kept at a single commit: amend and
      # force-push rather than adding a commit per refresh.
      - name: Publish to gh-pages (only if changed)
        working-directory: .ghpages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rsync -a --delete ../grid_json/ ./grid_json/
          git add grid_json
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit --amend --date=now \
              -m "Deploy site + data ($(date +%F)) — weekly grid refresh" \
              -m "Single-commit branch; source and history live on main."
            git push --force origin HEAD:gh-pages
          fi
